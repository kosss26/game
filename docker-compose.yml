# Полночь — развёртывание на своём сервере.
#   cp deploy/.env.example .env && nano .env
#   docker compose up -d --build
#   docker compose run --rm tools npm run seed
#   docker compose run --rm tools npm run bot:setup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polnoch
      POSTGRES_USER: polnoch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polnoch -d polnoch"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://polnoch:${POSTGRES_PASSWORD}@db:5432/polnoch
    depends_on:
      db:
        condition: service_healthy

  # HTTPS-сертификат Let's Encrypt выпускается автоматически.
  # Нужна A-запись домена на IP сервера и открытые порты 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Уведомления «открылся новый день» — каждые 15 минут
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?задайте CRON_SECRET в .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -fsS -m 55 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/notify || true
          echo
          sleep 900
        done
    depends_on:
      - app

  # Ежедневный бэкап БД в ./deploy/backups (хранятся 14 последних)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U polnoch -d polnoch -Fc -f /backups/polnoch-$$(date +%F).dump && echo "backup ok"
          ls -1t /backups/*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  # Разовые команды: seed, bot:setup
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://polnoch:${POSTGRES_PASSWORD}@db:5432/polnoch
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
