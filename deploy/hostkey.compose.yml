# Separate project behind the host's existing nginx. No Caddy, public DB or host network.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging: *logging
    environment:
      POSTGRES_DB: polnoch
      POSTGRES_USER: polnoch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private env is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U polnoch -d polnoch']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ${APP_TAG:?set by hostkey.sh}
    build: { context: ., target: runner }
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    logging: *logging
    env_file: ['${POLNOCH_ENV_FILE:-/etc/polnoch-stories/app.env}']
    environment:
      DATA_SOURCE: postgres
      DATABASE_URL: postgresql://polnoch:${POSTGRES_PASSWORD}@db:5432/polnoch
      DATABASE_POOL_SIZE: '10'
    ports: ['127.0.0.1:3500:3000']
    depends_on:
      db: { condition: service_healthy }
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 32
    logging: *logging
    environment: { CRON_SECRET: '${CRON_SECRET:?private env is required}' }
    entrypoint: [/bin/sh, -c]
    command:
      - |
        sleep 60
        while true; do
          curl -fsS -m 55 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/notify || true
          sleep 900
        done
    depends_on:
      app: { condition: service_healthy }
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging: *logging
    environment: { PGPASSWORD: '${POSTGRES_PASSWORD}' }
    volumes: [/var/lib/polnoch-stories/backups:/backups]
    entrypoint: [/bin/sh, -c]
    command:
      - |
        umask 077
        while true; do
          name=/backups/polnoch-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -h db -U polnoch -d polnoch -Fc -f "$$name.tmp"; then
            mv "$$name.tmp" "$$name"
            ls -1t /backups/*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
            echo 'Backup saved'
          else
            rm -f "$$name.tmp"
            echo 'Backup failed' >&2
          fi
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }
  tools:
    image: ${TOOLS_TAG:?set by hostkey.sh}
    build: { context: ., target: tools }
    profiles: [tools]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging: *logging
    env_file: ['${POLNOCH_ENV_FILE:-/etc/polnoch-stories/app.env}']
    environment:
      NODE_ENV: production
      DATA_SOURCE: postgres
      DATABASE_URL: postgresql://polnoch:${POSTGRES_PASSWORD}@db:5432/polnoch
volumes:
  pgdata: {}
